# HoneyShield X — Staging & Production HTTPS / TLS Nginx Configuration
# Compliant with Mozilla Modern / Intermediate Baseline and OWASP Hardening

# Plain HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Redirect plain HTTP to HTTPS
    location / {
        return 301 https://$host:8443$request_uri;
    }

    # Deny dotfiles and backups
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Primary HTTPS Server
server {
    listen 443 ssl;
    server_name localhost;
    server_tokens off;

    resolver 10.89.0.1 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/honeyshield.crt;
    ssl_certificate_key /etc/nginx/certs/honeyshield.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Hardened Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Block sensitive hidden files and backups
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # SPA Routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API and WebSocket reverse proxying
    location /api/ {
        set $backend_upstream "http://backend-staging:8000";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
