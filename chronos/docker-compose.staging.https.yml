version: '3.8'

services:
  chronos_staging_https:
    image: localhost/chronos:prod
    container_name: chronos_staging_https
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    read_only: false
