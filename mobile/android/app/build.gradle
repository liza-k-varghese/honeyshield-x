apply plugin: "com.android.application"

android {
    namespace "com.honeyshield.soc"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.honeyshield.soc"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.0.0-rc5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file("../../keystores/honeyshield-debug.keystore")
            storePassword "honeyshield123"
            keyAlias "honeyshield_debug"
            keyPassword "honeyshield123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
}

